version: '3.8'

# Real production deployment.
#
# Deliberately has NO `database` or `redis` service - unlike
# docker-compose.yml (which spins up its own local Postgres/Redis
# containers for a local "closer to production settings" run), this
# file has nothing local to fall back to. DATABASE_URL and REDIS_URL
# must point at the real managed services (DATABASE_URL at the managed
# Postgres/Neon instance, REDIS_URL at a managed/shared Redis) - if
# either is missing, `docker-compose -f docker-compose.prod.yml up`
# fails immediately with a clear error instead of silently starting
# against a local container that doesn't exist here, or against
# whatever default app/platform/configuration/config.py would otherwise fall back to.
#
# Usage:
#   export DATABASE_URL=postgresql://...neon-connection-string...
#   export REDIS_URL=redis://...managed-redis...
#   export SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
#   export CORS_ORIGINS=https://your-real-frontend-origin.example.com
#   # If using Google Drive storage: put the service-account JSON at
#   # ./backend/credentials/ on the host (mounted below) and set
#   # GOOGLE_DRIVE_CREDENTIALS_PATH to the container-side path
#   # (/app/credentials/<filename>.json), not the host path - the host
#   # path is never visible inside the container.
#   docker-compose -f docker-compose.prod.yml up --build -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: woodful_backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to the real production Postgres (Neon) connection string - there is no local database in this compose file}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set to a real managed/shared Redis instance - there is no local redis in this compose file}
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set - see the generate command in the usage comment above this file}
      COOKIE_SECURE: "True"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to the real frontend origin(s) - a localhost/empty value is rejected at startup}
      RATE_LIMIT_BACKEND: redis
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      SENDER_PASSWORD: ${SENDER_PASSWORD:-}
      SENDER_NAME: ${SENDER_NAME:-Woodful Creations}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set to the real frontend origin - used to build links sent in emails}
      GEMINI_ENABLED: ${GEMINI_ENABLED:-False}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-False}
      GOOGLE_DRIVE_CREDENTIALS_PATH: ${GOOGLE_DRIVE_CREDENTIALS_PATH:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      # The reverse proxy/load balancer's IP or CIDR in front of this
      # container - required for per-IP rate limiting to see real client
      # IPs rather than the proxy's own IP. Defaults to uvicorn's own
      # default (loopback only) if not set, which is wrong for almost any
      # real production topology - set this explicitly.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      # Google Drive service-account credentials, if STORAGE_PROVIDER=drive -
      # GOOGLE_DRIVE_CREDENTIALS_PATH must point at a file under
      # /app/credentials/ for it to actually be visible in the container
      # (see the usage comment above this file).
      - ./backend/credentials:/app/credentials:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:?REACT_APP_API_URL must be set to the real backend origin the browser should call}
    container_name: woodful_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
