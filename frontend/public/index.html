<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Static dark-theme default for the very first paint, before
         src/index.jsx's synchronous syncThemeColorMeta() call (and,
         on every later toggle, src/App.jsx's useThemeSync) update
         this to the active theme's real --background value - see
         src/utils/utils.js's syncThemeColorMeta for why this is never
         hardcoded a second time anywhere else. Matches the app's
         approved dark token (--color-ink / --background in
         src/styles/index.css). -->
    <meta name="theme-color" content="#101014" />
    <meta name="description" content="Woodful Creations - AI-powered management system" />
    <!-- Open Graph / social preview metadata - a single site-level set
         since this is a client-rendered SPA with one static index.html
         (no per-route server-side rendering to vary these per page).
         Internal-only app, so this only affects how a shared login-page
         link previews in chat/Slack, never a marketing surface. -->
    <meta property="og:title" content="Woodful Creations" />
    <meta property="og:description" content="Woodful Creations - AI-powered management system" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Woodful Creations" />
    <meta name="twitter:description" content="Woodful Creations - AI-powered management system" />
    <!-- iOS Safari ignores manifest.json icons for "Add to Home Screen" -
         apple-touch-icon must be linked directly, or the OS falls back to
         a screenshot of the page as the icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Woodful Creations" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Woodful Creations</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #0e0d0b;
        color: #f3ede1;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
